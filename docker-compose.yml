# =============================================================================
#  Argus AI — DEV Docker Compose (облегчённый стек, без MinIO и Egress)
# =============================================================================

networks:
  argus-dev:
    driver: bridge
    name: argus-dev-network

volumes:
  kafka-dev-data:
  clickhouse-dev-data:
  postgres-dev-data:
  redis-dev-data:
  badger-dev-data:

services:

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: argus-dev-kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=argus-dev-cluster-id-001
    volumes:
      - kafka-dev-data:/var/lib/kafka/data
    networks:
      - argus-dev
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── ClickHouse ──────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: argus-dev-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=${CH_DATABASE:-argus_analytics}
      - CLICKHOUSE_USER=${CH_USERNAME:-default}
      - CLICKHOUSE_PASSWORD=${CH_PASSWORD:-}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-dev-data:/var/lib/clickhouse
      - "./argus-infra/migrations/clickhouse:/docker-entrypoint-initdb.d:ro"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - argus-dev
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: argus-dev-postgres
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-argus}
      - POSTGRES_USER=${POSTGRES_USER:-argus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-argus_secret}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - "./argus-infra/migrations/postgres:/docker-entrypoint-initdb.d:ro"
    networks:
      - argus-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus} -d ${POSTGRES_DB:-argus}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: argus-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - argus-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── LiveKit ─────────────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: argus-dev-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-argus-dev-api-key}: ${LIVEKIT_API_SECRET:-argus-dev-secret-must-be-at-least-32-chars}"
      REDIS_HOST: "redis:6379"
    command: --dev --bind 0.0.0.0 --node-ip 0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - argus-dev
    restart: unless-stopped

  # ── AI Sidecar (Python: YOLOv8 + ArcFace) ───────────────────────────────────
  ai-sidecar:
    build:
      context: ./argus-backend/ai-sidecar
      dockerfile: Dockerfile
    container_name: argus-dev-ai-sidecar
    ports:
      - "8091:8091"
    volumes:
      - ./argus-backend/models:/models:ro
    environment:
      ONNX_MODELS_PATH: /models
      MODEL_FAIL_FAST: "false"
      YOLO_MODEL_FILE: yolov8n.onnx
      ARCFACE_MODEL_FILE: arcface.onnx
    networks:
      - argus-dev

  # ── Backend (Go) ─────────────────────────────────────────────────────────────
  backend:
    image: argus/backend:${BACKEND_TAG:-latest}
    build:
      context: ./argus-backend
      dockerfile: Dockerfile
      args:
        VERSION: ${BACKEND_TAG:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: argus-dev-backend
    entrypoint: ["/app/event-collector", "-config", "/app/config/config.yaml"]
    ports:
      - "${BACKEND_GRPC_PORT:-50051}:50051"
      - "${BACKEND_HTTP_PORT:-8080}:8080"
    user: "0:0"
    volumes:
      - ./argus-infra/docker/config.yaml:/app/config/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - badger-dev-data:/app/data/dlq
    environment:
      - EVENT_COLLECTOR_CORS_ORIGINS=${FRONTEND_ORIGIN:-*}
      - EVENT_COLLECTOR_INFERENCE_PYTHON_BRIDGE_URL=http://ai-sidecar:8091
      - EVENT_COLLECTOR_KAFKA_BROKERS=kafka:9092
      - EVENT_COLLECTOR_CH_ADDRS=clickhouse:9000
      - EVENT_COLLECTOR_CH_DATABASE=${CH_DATABASE:-argus_analytics}
      - EVENT_COLLECTOR_CH_USERNAME=${CH_USERNAME:-default}
      - EVENT_COLLECTOR_CH_PASSWORD=${CH_PASSWORD:-}
      - EVENT_COLLECTOR_PG_HOST=postgres
      - EVENT_COLLECTOR_PG_PORT=5432
      - EVENT_COLLECTOR_PG_DATABASE=${POSTGRES_DB:-argus}
      - EVENT_COLLECTOR_PG_USERNAME=${POSTGRES_USER:-argus}
      - EVENT_COLLECTOR_PG_PASSWORD=${POSTGRES_PASSWORD:-argus_secret}
      - EVENT_COLLECTOR_JWT_SIGNING_KEY=2xp8vaqUMGpY3uYRHGpMWLUqin9rfqy154qIaWPtay8=
      - EVENT_COLLECTOR_GRPC_PORT=50051
      - EVENT_COLLECTOR_HTTP_PORT=8080
      - EVENT_COLLECTOR_LOG_LEVEL=${LOG_LEVEL:-info}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-argus-dev-api-key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-argus-dev-secret-must-be-at-least-32-chars}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL:-ws://livekit:7880}
      - LIVEKIT_PUBLIC_WS_URL=${LIVEKIT_PUBLIC_WS_URL:-ws://localhost:7880}
      - EVENT_COLLECTOR_REDIS_ADDR=redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - argus-dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Frontend (Nuxt) ──────────────────────────────────────────────────────────
  frontend:
    image: argus/frontend:${FRONTEND_TAG:-latest}
    build:
      context: ./argus-frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
    container_name: argus-dev-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${BACKEND_PUBLIC_URL:-http://localhost:8080}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - argus-dev
    restart: unless-stopped
